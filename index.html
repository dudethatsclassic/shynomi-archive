<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shynomi's Live Archive</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="inner">
        <a class="site-logo" href="./index.html"><img class="site-logo-img" src="./favicon.png" alt=""><span class="site-logo-text">Shynomi's <span class="site-logo-live">Live</span><span>Archive</span></span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="home-intro">
      <div class="container">
        <p>A personal collection of live recordings</p>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; align-items: center;">
          <button class="home-btn-gold" id="show-search-btn" onclick="toggleShowSearch()">Search all shows →</button>
          <button class="home-btn-gold" id="artist-search-btn" onclick="toggleArtistSearch()">Search all artists →</button>
        </div>
        <div id="show-search-wrap" style="display:none; margin-top: 16px;">
          <input id="show-search-input" type="text" placeholder="Search by venue, city, artist, taper, or gear…" class="artist-search-input" oninput="filterShows(this.value)" />
          <div id="show-search-results" style="margin-top: 12px;"></div>
        </div>
        <div id="artist-search-wrap" style="display:none; margin-top: 16px;">
          <input id="artist-search-input" type="text" placeholder="Type an artist name…" class="artist-search-input" oninput="filterArtists(this.value)" />
        </div>
      </div>
    </div>

    <div class="container">
      <div class="section-header-row">
        <h1 class="section-title">Featured Artists</h1>
      </div>
      <div class="artist-grid" id="featured-grid"></div>
    </div>

    <div class="container" style="margin-top: 32px; margin-bottom: 64px; text-align: center;">
      <button id="other-toggle" class="other-artists-btn" onclick="toggleOther()">
        Other Artists <span id="other-arrow">↓</span>
      </button>
    </div>

    <div class="container" id="other-section" style="display:none; margin-top: 32px; margin-bottom: 64px;">
      <div class="section-header-row">
        <h2 class="section-title">Other Artists</h2>
      </div>
      <div class="other-artists-list" id="other-grid"></div>
    </div>
  </main>

  <script src="data/artists.js"></script>
  <script src="js/logo.js?v=2"></script>
  <script>
    const FEATURED_IDS = [
      'alice-in-chains',
      'counting-crows',
      'foo-fighters',
      'green-day',
      'incubus',
      'local-h',
      'metallica',
      'nirvana',
      'our-lady-peace',
      'pearl-jam',
      'primus',
      'radiohead',
      'red-hot-chili-peppers',
      'ryan-adams',
      'smashing-pumpkins',
      'soundgarden',
      'tool',
      'weezer',
      'wilco',
    ];

    function makeCard(artist) {
      const card = document.createElement('a');
      card.href      = `artists/${artist.id}/`;
      card.className = 'artist-card';

      const initials = artist.name
        .split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 3);

      card.innerHTML = `
        <div class="artist-card-img-wrap">
          <div class="artist-card-placeholder" data-id="${artist.id}">${initials}</div>
          <span class="artist-card-count">${artist.showCount} shows</span>
        </div>
        <div class="artist-card-info">
          <div class="artist-card-name">${artist.name}</div>
          <div class="artist-card-meta">${artist.firstYear}&ndash;${artist.lastYear}</div>
        </div>`;

      const img = new Image();
      img.onload = () => {
        const ph = card.querySelector('.artist-card-placeholder');
        const photo = document.createElement('img');
        photo.className = 'artist-card-photo';
        photo.src = img.src;
        photo.alt = artist.name;
        if (ph) ph.replaceWith(photo);
      };
      img.src = `images/${artist.id}/band.jpg`;


      return card;
    }

    const featuredSet = new Set(FEATURED_IDS);
    const featuredGrid = document.getElementById('featured-grid');
    const otherGrid    = document.getElementById('other-grid');

    // Render featured in the defined order
    const artistMap = {};
    ARTISTS.forEach(a => { if (a.id) artistMap[a.id] = a; });

    FEATURED_IDS.forEach(id => {
      const artist = artistMap[id];
      if (artist) featuredGrid.appendChild(makeCard(artist));
    });

    // Render all others alphabetically as list items
    ARTISTS
      .filter(a => a.id && !featuredSet.has(a.id))
      .forEach(a => {
        const item = document.createElement('a');
        item.href = `artists/${a.id}/`;
        item.className = 'other-artist-item';
        item.textContent = a.name;
        otherGrid.appendChild(item);
      });

    // ── Show search ──────────────────────────────────────────
    let allShowsLoaded = false;

    function toggleShowSearch() {
      const wrap  = document.getElementById('show-search-wrap');
      const input = document.getElementById('show-search-input');
      const open  = wrap.style.display === 'none';
      wrap.style.display = open ? 'block' : 'none';
      if (open) {
        input.value = '';
        document.getElementById('show-search-results').innerHTML = '';
        // Lazy-load all-shows.js on first open
        if (!allShowsLoaded) {
          const s = document.createElement('script');
          s.src = 'data/all-shows.js';
          s.onload = () => { allShowsLoaded = true; };
          document.head.appendChild(s);
        }
        input.focus();
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function filterShows(query) {
      const container = document.getElementById('show-search-results');
      const q = query.trim().toLowerCase();
      if (!q) { container.innerHTML = ''; return; }
      if (typeof ALL_SHOWS === 'undefined') {
        container.innerHTML = '<p style="color:#888;">Loading…</p>';
        setTimeout(() => filterShows(query), 200);
        return;
      }
      const matches = ALL_SHOWS.filter(show =>
        (show.venue  || '').toLowerCase().includes(q) ||
        (show.location || '').toLowerCase().includes(q) ||
        (show.artist || '').toLowerCase().includes(q) ||
        (show.taper  || '').toLowerCase().includes(q) ||
        (show.gear   || '').toLowerCase().includes(q)
      );
      if (matches.length === 0) {
        container.innerHTML = '<p style="color:#888; padding: 8px 0;">No results found.</p>';
        return;
      }
      container.innerHTML = `
        <div style="font-size:0.8rem;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;">${matches.length} result${matches.length !== 1 ? 's' : ''}</div>
        ${matches.map(show => `
          <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
            <div>
              <div style="font-size:0.9rem;font-weight:500;">${escapeHtml(show.venue)}</div>
              <div style="font-size:0.75rem;color:#888;margin-top:2px;">${escapeHtml(show.artist)}</div>
              ${show.gear || show.taper ? `<div style="font-size:0.75rem;color:#888;margin-top:2px;">${show.gear ? 'Gear: ' + escapeHtml(show.gear) + (show.taper ? ' · ' : '') : ''}${show.taper ? 'Taper: ' + escapeHtml(show.taper) : ''}</div>` : ''}
            </div>
            <div style="font-size:0.78rem;color:#888;white-space:nowrap;">${escapeHtml(show.date)}</div>
          </div>`).join('')}`;
    }

    function toggleOther() {
      const section = document.getElementById('other-section');
      const arrow   = document.getElementById('other-arrow');
      const open    = section.style.display === 'none';
      section.style.display = open ? 'block' : 'none';
      arrow.textContent     = open ? '↑' : '↓';
      if (open) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleArtistSearch() {
      const wrap  = document.getElementById('artist-search-wrap');
      const input = document.getElementById('artist-search-input');
      const open  = wrap.style.display === 'none';
      wrap.style.display = open ? 'block' : 'none';
      if (open) {
        input.value = '';
        filterArtists('');
        input.focus();
      } else {
        filterArtists(''); // reset on close
      }
    }

    // Search results container (injected once)
    const searchResultsGrid = document.createElement('div');
    searchResultsGrid.className = 'artist-grid';
    searchResultsGrid.id = 'search-results-grid';
    searchResultsGrid.style.marginTop = '0';

    const searchSection = document.createElement('div');
    searchSection.className = 'container';
    searchSection.id = 'search-results-section';
    searchSection.style.cssText = 'display:none; margin-top: 32px;';
    searchSection.appendChild(searchResultsGrid);
    document.querySelector('main').insertBefore(
      searchSection,
      document.querySelector('.container:nth-child(2)')
    );

    function filterArtists(query) {
      const q = query.trim().toLowerCase();
      const section = document.getElementById('search-results-section');
      const grid    = document.getElementById('search-results-grid');

      if (!q) {
        section.style.display = 'none';
        grid.innerHTML = '';
        return;
      }

      const matches = ARTISTS.filter(a => a.name && a.name.toLowerCase().includes(q));
      grid.innerHTML = '';
      matches.forEach(a => grid.appendChild(makeCard(a)));
      section.style.display = matches.length ? 'block' : 'none';

      if (matches.length === 0) {
        grid.innerHTML = '<p style="color:#888; padding: 12px 0;">No artists found.</p>';
        section.style.display = 'block';
      }
    }
  </script>

</body>
</html>
